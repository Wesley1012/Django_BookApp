{% extends "base.html" %}
{% load static %}

{% block content %}
    <h1>Восстановление пароля завершено</h1>
    <hr>
    <h5>Ваш пароль был сохранен. Теперь вы можете войти.</h5>
    <hr>
    <form action="{% url 'users:login' %}" method="post">
        {{ form }}
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Подтвердить</button>
    </form>
{% endblock %}
