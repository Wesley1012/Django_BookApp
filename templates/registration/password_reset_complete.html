{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'users/css/register.css' %}">
{% endblock %}

{% block content %}
<div class="register-cover">
    <div class="register-cover-filter"></div>
    <div class="register-container">
        <div class="register-card">
            <h1 class="register-title">✅ Пароль изменён</h1>
            
            <div style="text-align: center; padding: 20px;">
                <p style="font-size: 1.1rem; margin-bottom: 30px;">
                    Ваш пароль успешно изменён!
                </p>
                
                <a href="{% url 'login' %}" class="btn register-btn active" style="display: inline-block; width: auto; padding: 12px 30px !important;">
                    🔑 Войти в аккаунт
                </a>
            </div>
        </div>
    </div>
</div>

<a href="{% url 'home' %}" class="nav-home-btn">
    <i class="fas fa-home"></i> Главная
</a>

<div class="profile-footer">
    © Киря и Ваня
</div>
{% endblock %}
