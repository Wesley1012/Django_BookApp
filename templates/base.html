{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}В доме на курьих ножках - Книжный клуб{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <!-- ОБЩИЕ стили Tilda для ВСЕХ страниц -->
    <style>
        body.t-body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #ffffff; /* Белый фон для всего сайта */
        }
        .t-records {
            width: 100%;
        }

        /* Стили для кнопок Tilda (можно использовать везде) */
        .t-btn {
            font-family: Arial, sans-serif;
            color: #000000;
            border: 3px solid #000000;
            border-radius: 5px;
            text-transform: uppercase;
            font-weight: bold;
            padding: 12px 30px;
            transition: all 0.2s ease-in-out;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
        }
        .t-btn:hover {
            box-shadow: 0px 10px 20px rgba(0, 11, 48, 0.25);
            transform: translateY(-2px);
        }

        /* Цвета фона для блоков */
        .bg-tilda-1 { background-color: #ddc7c7; }
        .bg-tilda-2 { background-color: #e0d9d9; }

        /* Контейнер для контента страниц (кроме главной) */
        .page-content-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="t-body">
    <div id="allrecords" class="t-records">
        {% block content %}
        <!-- Сюда подставляется уникальный контент каждой страницы -->
        {% endblock %}
    </div>

    {% block extra_js %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
